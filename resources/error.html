<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: {{BG}}; color: {{FG}}; font-family: system-ui, sans-serif; }
  main { max-width: 30rem; padding: 2rem; }
  h1 { font-size: 1.5rem; font-weight: 500; margin: 0 0 .75rem; }
  p { color: {{MUTED}}; line-height: 1.5; margin: 0 0 1.5rem; }
  a { display: inline-block; padding: .6rem 1.4rem; border-radius: 1.5rem; text-decoration: none;
      background: {{ACCENT}}; color: {{ON_ACCENT}}; }
</style>
</head>
<body>
<main>
  <h1>{{TITLE}}</h1>
  <p>{{HOST}}<br>{{MESSAGE}}</p>
  <a href="{{URL}}">Try again</a>
</main>
</body>
</html>
