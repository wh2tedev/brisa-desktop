name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb-arm64:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config git dpkg-dev file \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-webengine-dev qt6-webengine-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtquick-window qml6-module-qtquick-shapes qml6-module-qtquick-dialogs qml6-module-qtwebengine \
            qml6-module-qtqml-workerscript
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBRISA_REQUIRE_ARM64=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: cd build && cpack
      - name: Check the package architecture
        run: dpkg-deb --field build/*.deb Architecture | grep -x arm64
      - uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
          generate_release_notes: true
